name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RARGO_TOKEN: ${{ secrets.RARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rargo
        run: curl -fsSL https://rargo.rs/install.sh | sh
      - name: Test (built and run on rargo.rs)
        run: |
          rargo nextest run
          cd gui && rargo nextest run --workspace --cargo-profile test-fast -P rargo
