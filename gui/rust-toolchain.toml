# obake: nightly for the parallel front-end (-Zthreads) and the Cranelift backend,
# which together roughly halve cold builds. (Pin a date once a download succeeds;
# installed and tested: rustc 1.102.0-nightly bdf712ee8 2026-11-21.)
[toolchain]
channel = "nightly"
profile = "minimal"
components = ["rustfmt", "clippy", "rust-analyzer", "rust-src", "rustc-codegen-cranelift-preview"]
